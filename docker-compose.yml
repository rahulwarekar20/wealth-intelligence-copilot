version: "3.9"

services:
  db:
    image: ankane/pgvector:latest
    container_name: wealth_copilot_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: wealth
      POSTGRES_PASSWORD: wealth_dev_password
      POSTGRES_DB: wealth_copilot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wealth -d wealth_copilot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata: